services:
  influxdb:
    image: influxdb:2.7
    container_name: influxdb
    ports:
      - 8086:8086
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_PASSWORD: IntegrationTestAdminPassword
      DOCKER_INFLUXDB_INIT_ORG: test
      DOCKER_INFLUXDB_INIT_BUCKET: test
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: IntegrationTestAdminToken
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 2s
      timeout: 5s
      retries: 30

  ruuvitag-gollector:
    build:
      context: ../
    container_name: ruuvitag-gollector
    depends_on:
      influxdb:
        condition: service_healthy
    volumes:
      - "../:/go/src/app"
    environment:
      INFLUXDB_HOST: http://influxdb:8086
      INFLUXDB_TOKEN: IntegrationTestAdminToken
    entrypoint: [ "/bin/bash" ]
    command: -c "/go/src/app/test/integration-test.sh"
