name: Unit Tests

on:
  push:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      packages: read
      actions: read
      contents: read

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Set up Go
      uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
      with:
        go-version: '1.27'

    - name: Build
      run: go build -tags postgres,influxdb,aws,gcp,mqtt

    - name: Run Unit Tests
      run: go test -tags postgres,influxdb,aws,gcp,mqtt -v ./...
